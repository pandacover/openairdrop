<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' file: data:" />
    <title>Beam Quick Send</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <section id="composer">
        <div class="input-row">
          <textarea id="text" rows="1" placeholder="Message, or drop files" spellcheck="true"></textarea>
          <button class="icon-btn" id="attach" title="Attach files (Ctrl+O)"><span data-icon="paperclip"></span></button>
          <button class="icon-btn solid" id="send" title="Send (Enter)"><span data-icon="send"></span></button>
        </div>
        <div id="files" class="files" hidden></div>
        <div class="bar" id="progress" hidden><div></div></div>
        <footer>
          <span class="to">To</span>
          <div id="devices" class="devices" role="radiogroup" aria-label="Send to"></div>
          <div id="status" class="status"></div>
        </footer>
      </section>

      <section id="empty" class="empty" hidden>
        <div>
          <div class="empty-title">No paired devices</div>
          <div class="muted">Pair a device in Beam once, then send to it from here.</div>
        </div>
        <button class="btn" id="open-main">Open Beam</button>
      </section>

      <div id="drop" class="drop" hidden>Drop to attach</div>
    </div>
    <script src="../shared/util.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
