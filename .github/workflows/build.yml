name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test protocol and crypto
        run: npm test

      - name: Take version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version like v1.2.3"
            exit 1
          fi
          echo "TAG_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build installer
        shell: bash
        run: npx electron-builder --win --x64 --publish never ${TAG_VERSION:+-c.extraMetadata.version=$TAG_VERSION}

      - uses: actions/upload-artifact@v4
        with:
          name: beam-windows-x64
          # latest.yml + blockmap are what installed copies read to auto-update.
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  macos:
    name: macOS (Apple silicon)
    runs-on: macos-14 # arm64 runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Take version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version like v1.2.3"
            exit 1
          fi
          echo "TAG_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build DMG (arm64)
        shell: bash
        env:
          # Optional. Without these the app is ad-hoc signed (see README).
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            if [ -n "$NOTARY_APPLE_ID" ]; then
              export APPLE_ID="$NOTARY_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
            fi
            npx electron-builder --mac --arm64 --publish never ${TAG_VERSION:+-c.extraMetadata.version=$TAG_VERSION}
          else
            echo "::warning::No Apple signing certificate configured; building an ad-hoc signed app."
            # Apple silicon refuses to run unsigned code, and electron-builder has no
            # automatic ad-hoc fallback, so opt in explicitly.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            node -e "
              const b = require('./package.json').build;
              b.mac = { ...b.mac, identity: '-', hardenedRuntime: false };
              if (process.env.TAG_VERSION) b.extraMetadata = { ...b.extraMetadata, version: process.env.TAG_VERSION };
              require('fs').writeFileSync('adhoc-build.json', JSON.stringify(b));
            "
            npx electron-builder --mac --arm64 --publish never --config adhoc-build.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: beam-macos-arm64
          # The updater installs from the .zip described in latest-mac.yml.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload installers and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already made on GitHub: add the downloads, keep it published/draft as it is.
            gh release upload "$TAG" artifacts/* --clobber
          else
            # Tag pushed from git: create a draft so nothing ships until it's published.
            gh release create "$TAG" artifacts/* --draft --generate-notes --title "$TAG"
          fi
